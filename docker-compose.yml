services:
  pyflow-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: uvicorn pyflow.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PYFLOW_API_TOKEN=${PYFLOW_API_TOKEN:-pyflow-dev-token-change-me}
    tmpfs:
      - /tmp
    volumes:
      - .:/app
    networks:
      - pyflow-network

  pyflow-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    command: node scripts/dev.mjs
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_BASE=http://pyflow-api:8000
      - PYFLOW_API_TOKEN=${PYFLOW_API_TOKEN:-pyflow-dev-token-change-me}
    volumes:
      - ./ui:/app
      - /app/node_modules
      - /app/.nuxt
      - /app/.output
    depends_on:
      - pyflow-api
    networks:
      - pyflow-network

networks:
  pyflow-network:
    driver: bridge
