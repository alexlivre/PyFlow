[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyflow"
version = "2.1.0"
description = "Local API for safe Python execution with AI assistance"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.137.1",
    "uvicorn==0.46.0",
    "typer==0.25.1",
    "litellm==1.97.0",
    "pydantic==2.13.3",
    "pydantic-settings==2.15.0",
    "loguru==0.7.3",
    "matplotlib==3.11.1",
    "psutil==7.2.2",
    "tenacity==9.1.4",
    "httpx==0.28.1",
    "openai==2.41.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "anyio==4.13.0",
]

[project.scripts]
pyflow = "pyflow.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
